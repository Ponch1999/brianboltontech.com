<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCHS Staff Room Finder</title>
<style>
:root{--red:#c8102e;--ink:#202124;--muted:#667085;--line:#e6e8ec;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:4px solid var(--red);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px #0000000c}
.brand{font-size:22px;font-weight:750;letter-spacing:-.4px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}
input,select,button,.directory{font:inherit;border:1px solid #cbd0d8;border-radius:9px;padding:10px 12px;background:white;color:var(--ink)}
input{width:min(330px,40vw)}button,.directory{cursor:pointer;text-decoration:none;font-weight:600}button:hover,.directory:hover{border-color:var(--red);background:#fff7f8}.directory{white-space:nowrap}
main{padding:14px;max-width:1800px;margin:auto}.mapcard{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 3px 14px #00000008}
.maphead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#stage{position:relative;width:100%;line-height:0;background:#fff}#floorimg{display:block;width:100%;height:auto}#dots{position:absolute;inset:0}
.dot{position:absolute;width:13px;height:13px;border:2px solid white;border-radius:50%;background:var(--red);box-shadow:0 0 0 1px #8f0b20,0 1px 4px #0005;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.dot:hover,.dot.selected{background:#ffb000;box-shadow:0 0 0 3px var(--red);z-index:5}.dot.hide{display:none}
#info{padding:12px 16px;background:#fff;border-top:1px solid var(--line);font-size:14px;min-height:44px;line-height:1.5}#info strong{font-size:16px}.muted{color:var(--muted)}.count{color:var(--muted);font-size:13px}
@media(max-width:760px){header{padding:12px}.controls{margin-left:0;width:100%}input{flex:1;width:auto;min-width:150px}main{padding:7px}.dot{width:12px;height:12px}}
</style></head><body>
<header><div><div class="brand">LCHS Staff Room Finder</div><div class="sub">Find a staff member or room · Select a marker for details</div></div>
<div class="controls"><select id="floor"><option value="1">1st Floor</option><option value="2">2nd Floor</option></select>
<input id="search" placeholder="Search staff name or room…" autocomplete="off"><button id="find">Find</button><button id="clear">Clear</button>
<a class="directory" href="https://www.lchsrailers.org/en-US/staff" target="_blank" rel="noopener">Official Staff Directory ↗</a></div></header>
<main><section class="mapcard"><div class="maphead"><strong id="floorTitle">1st Floor</strong><span class="count" id="count"></span><span class="muted">Click a red dot to view staff/location</span></div>
<div id="stage"><img id="floorimg" alt="LCHS floor plan"><div id="dots"></div></div><div id="info">Choose a marker or search for a staff member.</div></section></main>
