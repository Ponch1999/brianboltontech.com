<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCHS Staff Room Finder</title>
<style>
:root{--red:#c8102e;--ink:#202124;--muted:#667085;--line:#e6e8ec;--bg:#f6f7f9}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;min-height:100dvh}
header{background:#fff;border-bottom:4px solid var(--red);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px #0000000c;flex-shrink:0}
.brand{font-size:20px;font-weight:750;letter-spacing:-.4px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}
input,select,button,.directory{font:inherit;border:1px solid #cbd0d8;border-radius:8px;padding:8px 10px;background:white;color:var(--ink)}
input{width:min(300px,35vw)}button,.directory{cursor:pointer;text-decoration:none;font-weight:600}button:hover,.directory:hover{border-color:var(--red);background:#fff7f8}
main{padding:10px;max-width:1800px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex}
.mapcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px #00000008;display:flex;flex-direction:column;width:100%;min-height:0}
.maphead{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;flex-shrink:0}
#viewport{position:relative;overflow:hidden;touch-action:none;background:#fdfdfd;flex:1;min-height:220px;cursor:grab}
#viewport.dragging{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#floorimg{display:block;max-width:none;width:auto;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
#dots{position:absolute;inset:0}
.dot{position:absolute;width:12px;height:12px;padding:0;border:2px solid white;border-radius:50%;background:var(--red);box-shadow:0 0 0 1px #8f0b20,0 1px 4px #0005;transform:translate(-50%,-50%);cursor:pointer;z-index:2;min-width:0;line-height:1}
.dot:hover,.dot.selected{background:#ffb000;box-shadow:0 0 0 3px var(--red);z-index:5}.dot.hide{display:none}
.zoomtools{position:absolute;right:10px;top:10px;z-index:20;display:flex;gap:6px}
.zoomtools button{padding:7px 11px;background:#fff;box-shadow:0 1px 5px #0002;font-size:18px}
#info{padding:9px 13px;background:#fff;border-top:1px solid var(--line);font-size:14px;min-height:42px;line-height:1.45;flex-shrink:0}#info strong{font-size:16px}.muted{color:var(--muted)}.count{color:var(--muted);font-size:12px}
@media(max-width:760px){
 header{padding:8px 10px;gap:8px}.brand{font-size:18px}.controls{margin:0;width:100%;gap:5px}.controls select{flex:0 0 auto}.controls input{flex:1;width:80px;min-width:0}.controls button,.controls select,.controls input,.directory{font-size:13px;padding:7px 8px}.directory{display:none}
 main{padding:5px}.maphead{font-size:12px;padding:7px 9px}#viewport{min-height:200px}.dot{width:11px;height:11px;border-width:2px}.zoomtools button{padding:6px 10px;font-size:20px}#info{font-size:13px;padding:8px 10px}
}

#info{display:flex;align-items:center;gap:14px;min-height:94px;padding:12px 16px}
.staffavatar{width:68px;height:68px;flex:0 0 68px;border-radius:50%;background:linear-gradient(145deg,#c8102e,#7e1022);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;border:3px solid #f2d7dc;box-shadow:0 2px 6px #0002;overflow:hidden}
.staffavatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.staffdetails{min-width:0}.staffdetails .staffname{font-size:17px;font-weight:700}.staffmeta{font-size:12px;color:var(--muted)}
@media(max-width:760px){#info{min-height:80px;padding:9px}.staffavatar{width:54px;height:54px;flex-basis:54px;font-size:18px}}
</style></head><body>
<header><div><div class="brand">LCHS Staff Room Finder</div><div class="sub">Find a staff member or room · Select a marker for details</div></div>
<div class="controls"><select id="floor"><option value="1">1st Floor</option><option value="2">2nd Floor</option></select>
<input id="search" placeholder="Search staff name or room…" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"><button id="find">Find</button><button id="clear">Clear</button>
<a class="directory" href="https://www.lchsrailers.org/en-US/staff" target="_blank" rel="noopener">Official Staff Directory ↗</a>
<a class="directory" href="https://docs.google.com/spreadsheets/d/1KbgL6Pti1tqY5k_raM39-eoBGm1aD_dtkqhz-k49hV0/edit?gid=0#gid=0" target="_blank" rel="noopener">Staff Directory / Prep ↗</a></div></header>
<main><section class="mapcard"><div class="maphead"><strong id="floorTitle">1st Floor</strong><span class="count" id="count"></span><span class="muted">Click a red dot to view staff/location</span></div>

let floor="1",selected=null,scale=1,minScale=.1,maxScale=5,tx=0,ty=0,drag=null;
const $=id=>document.getElementById(id);
const natural={1:{w:865,h:999},2:{w:1122,h:1109}};
function fullName(r){return ((r["FIRST NAME"]||"")+" "+(r["LAST NAME"]||"")).trim()}
function fit(){
 const v=$("viewport"),dims=natural[floor],availW=v.clientWidth-24,availH=v.clientHeight-24;
 minScale=Math.min(availW/dims.w,availH/dims.h);scale=minScale;tx=(v.clientWidth-dims.w*scale)/2;ty=(v.clientHeight-dims.h*scale)/2;applyTransform();
}
function applyTransform(){$("canvas").style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function positionDot(d,x,y){d.style.left=x+"px";d.style.top=y+"px";}
function draw(){
 $("floorTitle").textContent=floor==="1"?"1st Floor":"2nd Floor";$("floorimg").src=images[floor];$("floorimg").style.width=natural[floor].w+"px";$("floorimg").style.height=natural[floor].h+"px";
 $("canvas").style.width=natural[floor].w+"px";$("canvas").style.height=natural[floor].h+"px";$("dots").innerHTML="";
 let n=0;data.forEach((r,i)=>{if(String(r.Floor)!==floor||r["Pixel X"]===""||r["Pixel Y"]==="")return;n++;
 let d=document.createElement("button");d.type="button";d.className="dot"+(selected===i?" selected":"");d.title=fullName(r)+" · Room "+r["ROOM #"];d.setAttribute("aria-label",d.title);
 positionDot(d,Number(r["Pixel X"]),Number(r["Pixel Y"]));d.dataset.i=i;d.onclick=e=>{e.stopPropagation();show(i);};$("dots").appendChild(d);
 });$("count").textContent=n+" locations";filterDots();fit();

function photoKey(name){return String(name).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
function show(i){
 selected=i;let r=data[i],name=fullName(r)||"Location",room=r["ROOM #"]||"—",dept=r["DEPARTMENT"]||"",ext=r["EXTENSION #"]||"",key=photoKey(name),photo=staffPhotos[key];
 let initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"L";
 $("info").innerHTML="<div class='staffavatar' id='staffAvatar'>"+esc(initials)+"</div><div class='staffdetails'><div class='staffname'>"+esc(name)+"</div><div>Room "+esc(room)+" · Floor "+esc(r.Floor||floor)+"</div>"+(dept?"<div class='staffmeta'>"+esc(dept)+"</div>":"")+(ext?"<div class='staffmeta'>Extension: "+esc(ext)+"</div>":"")+"</div>";
 if(photo){$("staffAvatar").innerHTML="<img src='staff_photos/"+esc(photo)+"' alt='"+esc(name)+"' loading='lazy'>";}
 document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("selected",Number(d.dataset.i)===i));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filterDots(){let q=$("search").value.trim().toLowerCase();document.querySelectorAll(".dot").forEach(d=>{let r=data[Number(d.dataset.i)],txt=(fullName(r)+" "+r["ROOM #"]+" "+r["DEPARTMENT"]).toLowerCase();d.classList.toggle("hide",!!q&&!txt.includes(q))})}
function zoomAt(factor,cx,cy){let next=Math.max(minScale,Math.min(maxScale,scale*factor));factor=next/scale;tx=cx-(cx-tx)*factor;ty=cy-(cy-ty)*factor;scale=next;applyTransform()}
function find(){$("search").blur();let q=$("search").value.trim().toLowerCase();if(!q)return;let i=data.findIndex(r=>String(r.Floor)===floor&&(fullName(r)+" "+r["ROOM #"]+" "+r["DEPARTMENT"]).toLowerCase().includes(q));if(i<0)i=data.findIndex(r=>(fullName(r)+" "+r["ROOM #"]+" "+r["DEPARTMENT"]).toLowerCase().includes(q));if(i<0){$("info").textContent="No staff member or room matched that search.";return}if(String(data[i].Floor)!==floor){floor=String(data[i].Floor);$("floor").value=floor;draw()}show(i);let r=data[i],v=$("viewport");zoomAt(Math.max(2,1.8/minScale),v.clientWidth/2,v.clientHeight/2);tx=v.clientWidth/2-Number(r["Pixel X"])*scale;ty=v.clientHeight/2-Number(r["Pixel Y"])*scale;applyTransform()}
$("floor").onchange=()=>{floor=$("floor").value;selected=null;$("info").textContent="Choose a marker or search for a staff member.";draw()};
$("find").onclick=find;$("search").addEventListener("keydown",e=>{if(e.key==="Enter")find();else filterDots()});
$("clear").onclick=()=>{$("search").value="";filterDots();$("info").textContent="Choose a marker or search for a staff member.";selected=null;draw()};
$("zoomIn").onclick=()=>zoomAt(1.25,$("viewport").clientWidth/2,$("viewport").clientHeight/2);
$("zoomOut").onclick=()=>zoomAt(.8,$("viewport").clientWidth/2,$("viewport").clientHeight/2);
$("resetZoom").onclick=fit;
$("viewport").addEventListener("wheel",e=>{e.preventDefault();let r=$("viewport").getBoundingClientRect();zoomAt(e.deltaY<0?1.15:.87,e.clientX-r.left,e.clientY-r.top)},{passive:false});
// Touch-friendly pan + two-finger pinch zoom (plus/minus buttons remain available).
const activePointers=new Map();let pinch=null;
function pointInViewport(e){const r=$("viewport").getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function pinchState(){const pts=[...activePointers.values()];if(pts.length<2)return null;const a=pts[0],b=pts[1];return {distance:Math.hypot(b.x-a.x,b.y-a.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,scale};}
$("viewport").addEventListener("pointerdown",e=>{if(e.target.closest(".zoomtools")||e.target.closest(".dot"))return;activePointers.set(e.pointerId,pointInViewport(e));try{$("viewport").setPointerCapture(e.pointerId)}catch(_){};if(activePointers.size===2){pinch=pinchState();drag=null;}else if(activePointers.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};$("viewport").classList.add("dragging");}});
$("viewport").addEventListener("pointermove",e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,pointInViewport(e));if(activePointers.size>=2&&pinch){const now=pinchState();if(now&&pinch.distance>0){const factor=now.distance/pinch.distance;zoomAt(factor,now.cx,now.cy);pinch={...now,scale};}}else if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform();}});
function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size<2)pinch=null;if(activePointers.size===1){const remaining=[...activePointers.keys()][0];drag=null;}else stopDrag();}
function stopDrag(){drag=null;$("viewport").classList.remove("dragging")}
$("viewport").addEventListener("pointerup",endPointer);$("viewport").addEventListener("pointercancel",endPointer);$("viewport").addEventListener("lostpointercapture",endPointer);
window.addEventListener("resize",fit);
draw();</script></body></html>
